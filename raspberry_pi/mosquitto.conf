# Mosquitto MQTT Broker Configuration — AgriTech Rover
# The Pi and the backend server MUST be on the same local network.

# Listener on all interfaces so both Pi and browser can connect.
listener 1883 0.0.0.0

# Allow unauthenticated clients (suitable for local LAN only).
# To add authentication, set allow_anonymous false and add a password file.
allow_anonymous true

# Log only warnings and above to reduce noise.
log_type warning
log_type error

# Persist subscriptions across restarts (useful for Pi reconnects)
persistence true
persistence_location /mosquitto/data/
