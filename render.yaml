services:
  - type: web
    name: agtech-backend
    env: python
    region: oregon
    plan: starter
    rootDir: .
    healthCheckPath: /health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://agtech-frontend-3p3n.onrender.com"]'
      - key: USE_MOCK_AI_PROVIDER
        value: "true"

